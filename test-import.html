<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Import</title>
</head>
<body>
  <h1>Testing ES6 Module Import</h1>
  <div id="result"></div>
  
  <script type="module">
    console.log('Starting import test...');
    
    try {
      const { initApp } = await import('./js/app.js');
      console.log('✅ app.js imported successfully');
      
      if (typeof initApp === 'function') {
        console.log('✅ initApp is a function');
        document.getElementById('result').innerHTML = '✅ Import successful! initApp is ready.';
      } else {
        console.error('❌ initApp is not a function:', typeof initApp);
        document.getElementById('result').innerHTML = '❌ initApp is not a function';
      }
    } catch (error) {
      console.error('❌ Import failed:', error);
      document.getElementById('result').innerHTML = `❌ Import failed: ${error.message}<br><pre>${error.stack}</pre>`;
    }
  </script>
</body>
</html>
