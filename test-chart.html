<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chart Test</title>
  <style>
    body { background: #0a0a1a; margin: 0; padding: 20px; font-family: sans-serif; color: white; }
    canvas { border: 1px solid #333; }
    .info { margin: 10px 0; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>📊 Candlestick Chart Test</h1>
  <div class="info">This should display a candlestick chart with EMA lines</div>
  <canvas id="price-chart" style="width: 100%; height: 500px;"></canvas>
  
  <script type="module">
    import { CandlestickChart } from './js/chart.js';
    
    // Generate test data
    const testCandles = [];
    let price = 65000;
    for (let i = 0; i < 100; i++) {
      const change = (Math.random() - 0.5) * 500;
      const open = price;
      const close = price + change;
      const high = Math.max(open, close) + Math.random() * 200;
      const low = Math.min(open, close) - Math.random() * 200;
      
      testCandles.push({
        time: Date.now() - (100 - i) * 86400000,
        open, high, low, close,
        volume: Math.random() * 1e9
      });
      
      price = close;
    }
    
    // Initialize chart
    const chart = new CandlestickChart('price-chart');
    
    // Calculate simple EMA
    function calcEMA(data, period) {
      const result = [];
      const multiplier = 2 / (period + 1);
      let ema = data.slice(0, period).reduce((a, b) => a + b) / period;
      result.push(ema);
      
      for (let i = period; i < data.length; i++) {
        ema = (data[i] - ema) * multiplier + ema;
        result.push(ema);
      }
      return result;
    }
    
    const closes = testCandles.map(c => c.close);
    const ema9 = calcEMA(closes, 9);
    const ema21 = calcEMA(closes, 21);
    
    // Render chart
    setTimeout(() => {
      chart.setData(testCandles, { ema9, ema21 });
      console.log('✅ Chart rendered successfully!');
    }, 100);
  </script>
</body>
</html>
